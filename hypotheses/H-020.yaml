id: H-020
title: BTC out of the market when 7-day net deposits to exchanges are in their top 20%
status: registered
family: flows
created: '2026-10-14'
author: F1DevBin (idea), Claude (spec)
rationale: 'Idea by F1DevBin: coins moved to exchanges before price moves carry information. Deposits
  usually precede selling, so heavy net inflow should precede weaker returns (CryptoQuant and others read
  large inflows as bearish). Data: Coin Metrics community exchange flows, free for the last ~30 days only,
  so the history is collected daily from 2026-09 and the test waits until a year has accumulated (test_after).
  Both directions are reported: if heavy deposits come before rises instead, this hypothesis fails and
  the reverse is a new hypothesis.'
spec:
  kind: timing_rule
  rule:
    type: feature_vs_rolling_quantile
    feature: exnetflow_btc_7d
    q: 0.8
    long_when: not_above
    lookback: 365
    min_periods: 180
    lag: 1
  mode: long_flat
  fee: 0.001
  universe:
  - BTCUSDT
  periods:
  - name: forward
    start: '2026-09-01'
  significance:
    method: circular_shift
    n: 2000
    alpha: 0.025
  criterion:
    min_wins:
      forward: 1
    require_significance: true
retest_every_days: 90
test_after: '2027-10-15'
registered: '2026-10-14'
prereg_sha256: fcf606ddd02ba3e0a36b3e1ef4189a59b598ceaa7d1acd7846af6bfb22af9ccb
