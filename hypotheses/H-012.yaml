id: H-012
title: Volatility targeting (30%/yr) beats buy-and-hold on BTC, ETH, SOL
status: weak
family: risk
created: '2026-10-14'
author: Claude (literature review for F1DevBin)
rationale: 'Scaling exposure to a constant volatility target cuts exposure in turbulent periods, when
  crypto drawdowns cluster. Man Group reports about +0.4 Sharpe for BTC with ex-ante 30% vol scaling (2012-2024),
  following Harvey et al. (2018) ''The impact of volatility targeting''. Spot, no leverage (position capped
  at 1). Source: https://www.man.com/insights/crypto-too-hot-to-handle'
