id: H-020
title: BTC out of the market when 7-day net deposits to exchanges are in their top 20%
status: passed
family: flows
created: '2026-10-14'
author: F1DevBin (idea), Claude (spec)
rationale: 'Idea by F1DevBin: coins moved to exchanges before price moves carry information. Deposits
  usually precede selling, so heavy net inflow should precede weaker returns (CryptoQuant and others read
  large inflows as bearish). Data: Coin Metrics community exchange flows (free, full history since 2011
  for BTC, 2015 for ETH); collected daily into datasets/exchange_flows.csv. Spec revised on 2026-10-14
  before any test was run: the first version waited a year for data, until it turned out the full history
  is available.'
spec:
  kind: timing_rule
  rule:
    type: feature_vs_rolling_quantile
    feature: exnetflow_btc_7d
    q: 0.8
    long_when: not_above
    lookback: 365
    min_periods: 180
    lag: 1
  mode: long_flat
  fee: 0.001
  universe:
  - BTCUSDT
  periods:
  - name: oos
    start: '2022-01-01'
  significance:
    method: circular_shift
    n: 2000
    alpha: 0.025
  criterion:
    min_wins:
      oos: 1
    require_significance: true
retest_every_days: 90
registered: '2026-10-14'
prereg_sha256: ad7da5beb9884261b70580c2f7327406a6009c71d45733822c147b70a3538911
last_run: '2026-10-14'
