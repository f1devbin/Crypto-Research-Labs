# Scheduled research agents.
#   daily  : data steward (refresh cache + integrity) and regime watch (alerts on band changes)
#   weekly : the above, then the hypothesis runner and the digest; results/ and reports/ are committed
#   daily  : also the model forecast (H-029/H-030), committed at once so its time proves it came before 12:00 UTC
#   always : the dashboard is rebuilt from the fresh data and deployed to GitHub Pages
# The data cache and the watch state live in actions/cache, so nothing is re-downloaded from scratch.
# Schedule: GitHub starts scheduled runs hours late, so the workflow wakes every hour of the morning and the
# gate job (src/crl/schedule_gate.py) lets the first run that finds yesterday's data published by every source
# (Binance, Coin Metrics, alternative.me, DefiLlama) do the work; on Mondays that run is the weekly one.
name: research-agents

on:
  schedule:
    - cron: "17 0-11 * * *"   # hourly 00:17–11:17 UTC; the gate picks the first run with all data in
  push:
    branches: [main]
    paths: ["src/crl/site*.py", "src/crl/i18n.py", "src/crl/course.py", "site/**", "config/**", ".github/workflows/research-agents.yml"]
  workflow_dispatch:
    inputs:
      full:
        description: "Also run due hypotheses and the digest"
        type: boolean
        default: true
      force:
        description: "Re-run every rerunnable hypothesis, not only the due ones"
        type: boolean
        default: false
      test_alert:
        description: "Send a test Telegram message"
        type: boolean
        default: false
      digest:
        description: "Write and send the weekly digest (full runs only)"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: crl-data          # one writer of the cache at a time
  cancel-in-progress: false

env:
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  TELEGRAM_LANG: ${{ vars.TELEGRAM_LANG }}   # en (default), ru, es, pt, tr, vi, zh
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional: plain-language weekly digest
  LLM_API_KEY: ${{ secrets.LLM_API_KEY }}               # or a free OpenAI-compatible provider (Groq by default)
  CRL_LLM_BASE_URL: ${{ vars.CRL_LLM_BASE_URL }}
  CRL_LLM_MODEL: ${{ vars.CRL_LLM_MODEL }}

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.gate.outputs.go }}
      full: ${{ steps.gate.outputs.full }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - id: gate
        env:
          FULL_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.full }}
          CRL_SITE_URL: ${{ vars.CRL_SITE_URL }}
          PYTHONPATH: src
        run: python3 -m crl.schedule_gate

  agents:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FULL: ${{ needs.gate.outputs.full }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .

      - name: Test Telegram alert
        if: github.event_name == 'workflow_dispatch' && inputs.test_alert
        run: crl notify-test

      - name: Restore data cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data
            datasets
          key: crl-data-${{ github.run_id }}
          restore-keys: crl-data-

      - name: Data steward
        id: steward
        run: crl data refresh
        continue-on-error: true   # problems are alerted and reported; the watch still runs on what we have

      - name: Regime watch
        run: crl watch

      - name: Daily model forecast (H-029/H-030)
        id: forecast
        run: crl forecast
        continue-on-error: true   # a missing input must not stop the dashboard

      - name: Commit the forecast log
        if: steps.forecast.outcome == 'success'
        run: |
          git config user.name "crl-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in datasets/forecast_log.csv datasets/noon_prices.csv datasets/forecast_models; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "chore(forecast): model forecast $(date -u +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Hypothesis runner
        if: env.FULL == 'true'
        run: crl run ${{ inputs.force && '--force' || '' }}
        continue-on-error: true   # a data error in one study must not block the digest and the commit

      - name: Coverage scan (every tested rule on every coin)
        if: env.FULL == 'true'
        run: crl scan
        continue-on-error: true

      - name: Digest
        if: env.FULL == 'true' && inputs.digest != false
        run: crl digest

      - name: Build dashboard
        env:
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          CRL_SITE_URL: ${{ vars.CRL_SITE_URL }}
        run: crl site

      - name: Refresh README screenshots
        if: env.FULL == 'true'
        continue-on-error: true
        run: |
          pip install -q playwright
          python -m playwright install --with-deps chromium > /dev/null
          python scripts/screenshots.py _site docs/screenshots

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Save data cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data
            datasets
          key: crl-data-${{ github.run_id }}

      - name: Commit results and reports
        if: env.FULL == 'true'
        run: |
          git config user.name "crl-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results reports hypotheses docs/screenshots datasets
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "chore(results): scheduled run $(date -u +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Fail if the data steward failed
        if: steps.steward.outcome == 'failure'
        run: exit 1

  deploy-pages:
    needs: agents
    if: ${{ !cancelled() && needs.agents.result != 'skipped' }}   # publish fresh numbers even if one data source failed
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
