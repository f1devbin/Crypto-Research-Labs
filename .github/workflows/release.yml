# GitHub Release for the version in pyproject.toml: tag v<version>, notes from that version's
# CHANGELOG section, the Python package and a snapshot of the registry, results and reports.
# Run it manually (Actions → release → Run workflow) after bumping the version, or push a v* tag.
name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$v" ]; then
            echo "tag ${GITHUB_REF_NAME} != pyproject version $v"; exit 1
          fi
          if gh release view "v$v" > /dev/null 2>&1; then echo "release v$v already exists"; exit 1; fi
          echo "TAG=v$v" >> "$GITHUB_ENV"
      - name: Release notes from CHANGELOG
        run: |
          v="${TAG#v}"
          awk -v v="$v" '/^## \[/{p = index($0, "[" v "]") > 0; next} p' CHANGELOG.md > notes.md
          echo "" >> notes.md
          echo "Live dashboard: https://f1devbin.github.io/Crypto-Research-Labs/" >> notes.md
          test -s notes.md
      - name: Build package and research snapshot
        run: |
          pip install -q build
          python -m build
          tar -czf "dist/research-snapshot-${TAG}.tar.gz" hypotheses results reports config docs
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "Crypto Research Labs $TAG" --notes-file notes.md --latest
