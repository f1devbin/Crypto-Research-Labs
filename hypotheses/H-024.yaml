id: H-024
title: 'Relative strength rotation: hold the 3 strongest coins (1- and 3-day), skip extreme one-day jumps,
  only while BTC is above its 200-day average'
status: rejected
family: trend
created: '2026-10-21'
author: ChatGPT proposal, formalised by Claude for F1DevBin
rationale: 'Proposed by ChatGPT (via F1DevBin), model C of its plan, adapted from hourly to daily data.
  Coins that outperform the others over 1 and 3 days (the 24 h / 72 h windows of the proposal) keep outperforming
  for a while; buying right after an extreme one-day jump catches the reversal instead, so those coins
  are skipped; and the whole thing only runs while the market as a whole (BTC) is in an uptrend. Ranking
  by return relative to BTC gives exactly the same order as ranking by raw return, so the proposal''s
  models A and B are one test (H-025). Benchmark: an equal-weight basket of the same coins, rebalanced
  daily without fees. Hourly trading was not tested: with 0.1% fees per side a daily-held signal is the
  cheapest version of the idea, if this fails the hourly one is very unlikely to survive costs.'
