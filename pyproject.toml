[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-research-labs"
version = "0.4.0"
description = "Pre-registered, reproducible crypto trading research with proactive automated workflows"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "F1DevBin" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
crl = "crl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
