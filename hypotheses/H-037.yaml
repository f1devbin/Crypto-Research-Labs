author: llm:openai/gpt-oss-120b; widened to every coin by Claude (rule 7)
rationale: 'Gate.io line of H-035 (rule 7: the Gate coins are tested on their own line, with Gate''s fee
  0.2 % and slippage 0.2 % per side, from 2023-03-13 when all of them have prices; long/flat, as Gate
