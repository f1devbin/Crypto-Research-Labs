id: H-014
title: '1-week time-series momentum: hold only after a positive 7-day return (BTC, ETH, SOL)'
status: weak
family: trend
created: '2026-10-14'
author: Claude (literature review for F1DevBin)
rationale: 'Liu & Tsyvinski (2021, Review of Financial Studies, ''Risks and Returns of Cryptocurrency'')
  find strong short-horizon time-series momentum: a one-standard-deviation higher weekly BTC return predicts
  a 3.16% higher return next week. Their sample ends in 2018, so 2022+ is a clean out-of-sample test.
  Source: https://www.nber.org/system/files/working_papers/w24877/w24877.pdf'
spec:
  kind: timing_rule
  rule:
    type: tsmom
    lookback: 7
  mode: long_flat
  fee: 0.001
  universe:
  - BTCUSDT
  - ETHUSDT
  - SOLUSDT
  periods:
  - name: oos
    start: '2022-01-01'
  significance:
    method: circular_shift
    n: 2000
    alpha: 0.0167
  criterion:
    min_wins:
      oos: 2
    require_significance: true
retest_every_days: 90
